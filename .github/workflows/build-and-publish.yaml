name: Build and Release

permissions:
  contents: write
  issues: write
  id-token: write

on:
  push:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  tests-matrix:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # Must match engines.node in package.json
        node-version:
          - ">=24.19.0 <25"
          - ">=26.13.1 <27"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install NPM version specified in package.json
        uses: ./.github/actions/install-npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Compile TypeScript
        run: npx tsc

      - name: Check source code with eslint
        run: npx eslint ./

      - name: Check if source code is properly formatted
        run: npx prettier -c ./

      - name: Run tests
        run: npm test

  tests:
    # Must match the required status check in the branch ruleset.
    name: main

    runs-on: ubuntu-latest

    needs: [tests-matrix]

    # Stable required status check for the branch ruleset, independent of
    # the Node.js versions in the matrix.
    if: ${{ always() }}

    steps:
      - name: All tests must have succeeded
        env:
          RESULT: ${{ needs.tests-matrix.result }}
        run: test "$RESULT" = "success"

  release:
    runs-on: ubuntu-latest

    needs: [tests]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ">=26.13.1 <27"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install NPM version specified in package.json
        uses: ./.github/actions/install-npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Semantic release
        run: npx semantic-release
